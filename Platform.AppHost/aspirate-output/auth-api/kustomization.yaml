resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: auth-api-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080
    - IDENTITYDB_HOST=sql
    - IDENTITYDB_PORT=1433
    - IDENTITYDB_USERNAME=sa
    - IDENTITYDB_DATABASENAME=IdentityDb
    - ASPNETCORE_URLS=http://+:8080;

