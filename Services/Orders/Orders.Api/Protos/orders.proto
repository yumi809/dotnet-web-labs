syntax = "proto3";

package bookhub.orders.v1;

option csharp_namespace = "Orders.Grpc.V1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

service OrdersService {
  rpc GetOrder (GetOrderRequest) returns (OrderReply);
  rpc GetCustomer (GetCustomerRequest) returns (CustomerReply);
}

message GetOrderRequest {
  int64 id = 1;
}

message GetCustomerRequest {
  int64 id = 1;
}

message OrderItem {
  int64 product_id = 1;
  string product_name = 2;
  int64 unit_price_cents = 3;
  int32 quantity = 4;
}

message OrderReply {
  int64 id = 1;
  string order_number = 2;
  int64 customer_id = 3;
  string status = 4;
  int64 payable_cents = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated OrderItem items = 7;
}

message CustomerReply {
  int64 id = 1;
  string full_name = 2;
  string email = 3;
  google.protobuf.StringValue city = 4;
  google.protobuf.StringValue loyalty_level = 5;
}
