syntax = "proto3";

package bookhub.catalog.v1;

option csharp_namespace = "Catalog.Grpc.V1";

import "google/protobuf/wrappers.proto";

// gRPC-контракт Каталогу для внутрішніх викликів (Aggregator)
service CatalogService {
  rpc GetProduct (GetProductRequest) returns (ProductReply);
  rpc GetProducts (GetProductsRequest) returns (ProductsReply);
}

message GetProductRequest {
  int64 id = 1;
}

message GetProductsRequest {
  repeated int64 ids = 1;
}

message CategoryRef {
  int32 id = 1;
  string name = 2;
}

message ProductReply {
  int64 id = 1;
  string sku = 2;
  string name = 3;
  string author = 4;
  // ціна в копійках (int64) — без втрат точності, на відміну від double
  int64 price_cents = 5;
  int32 stock_quantity = 6;
  bool is_active = 7;
  google.protobuf.StringValue publisher_name = 8;
  repeated CategoryRef categories = 9;
}

message ProductsReply {
  repeated ProductReply products = 1;
  repeated int64 not_found_ids = 2;
}
