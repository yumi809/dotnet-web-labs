syntax = "proto3";

package bookhub.reviews.v1;

option csharp_namespace = "Reviews.Grpc.V1";

import "google/protobuf/timestamp.proto";

service ReviewsService {
  rpc GetProductRating (ProductRatingRequest) returns (ProductRatingReply);
  rpc GetLatestReviews (LatestReviewsRequest) returns (LatestReviewsReply);
}

message ProductRatingRequest {
  int64 product_id = 1;
}

message ProductRatingReply {
  int64 product_id = 1;
  string product_name = 2;
  int64 reviews_count = 3;
  double average = 4;
}

message LatestReviewsRequest {
  int64 product_id = 1;
  int32 count = 2;
}

message ReviewSummary {
  string id = 1;
  string author_name = 2;
  int32 rating = 3;
  string title = 4;
  int32 helpful_votes = 5;
  google.protobuf.Timestamp created_at = 6;
}

message LatestReviewsReply {
  repeated ReviewSummary reviews = 1;
  int64 total_count = 2;
}
