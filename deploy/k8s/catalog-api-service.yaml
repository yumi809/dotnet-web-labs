# ClusterIP Service: стабільне DNS-ім'я catalog-api (catalog-api.<namespace>.svc.cluster.local)
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  labels:
    app: catalog-api
spec:
  type: ClusterIP
  selector:
    app: catalog-api          # поди Deployment-а за лейблом
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
