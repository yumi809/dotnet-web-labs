apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels:
    app: catalog-api
    app.kubernetes.io/part-of: bookhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: bookhub/catalog-api:1.0          # docker build -f Services/Catalog/Catalog.Api/Dockerfile -t bookhub/catalog-api:1.0 .
          imagePullPolicy: IfNotPresent           # локальний образ (kind load / minikube image load)
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bookhub-config
            - secretRef:
                name: catalog-api-secrets         # ConnectionStrings__CatalogDb, ConnectionStrings__redis, ConnectionStrings__messaging, Jwt__SigningKey
          # Проби з Лаб. 07: liveness — лише процес, readiness — БД, Redis (Degraded) тощо
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24                  # до 2 хв на міграції БД при старті
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
